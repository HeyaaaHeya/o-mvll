name: 'O-MVLL NDK ARM64 Build'
on: 
  workflow_dispatch:
  push:

jobs:
  build-arm64:
    # Menggunakan runner VM ARM64 native dari GitHub
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Install tools kompilasi langsung di OS Ubuntu ARM64
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang llvm-dev python3-dev

      - name: Get deployment version
        id: versioning
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          LATEST_TAG="${LATEST_TAG#v}"
          [ -z "$LATEST_TAG" ] && LATEST_TAG="1.0.0"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
          NEXT_VERSION="${MAJOR}-$((MINOR + 1))-0"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      # Kompilasi OMVLL dari Source Code secara Native di ARM64
      - name: Build O-MVLL ARM64
        run: |
          mkdir build && cd build
          cmake -G Ninja .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$(llvm-config --cmakedir)
          ninja
          
          mkdir -p ${{ github.workspace }}/dist
          find . -name "*.so" -exec cp {} ${{ github.workspace }}/dist/omvll-ndk.so \;

      # Upload Artifact omvll-ndk.so versi ARM64
      - name: Upload ARM64 Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omvll-plugin-arm64
          path: ${{ github.workspace }}/dist/omvll-ndk.so
